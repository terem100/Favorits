name: 3ddd Scraper

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: scrape (основной) или test (тест 5 моделей)'
        required: false
        default: 'scrape'
        type: choice
        options:
          - scrape
          - test
      group:
        description: 'Номер группы (0-4), только для режима scrape'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка puppeteer-core
        run: npm install puppeteer-core
        working-directory: scraper

      - name: Путь к системному Chrome
        run: |
          CHROME=$(which google-chrome || which chromium-browser || which chromium || echo "")
          if [ -z "$CHROME" ]; then echo "❌ Chrome не найден!"; exit 1; fi
          echo "✓ Chrome найден: $CHROME"
          echo "CHROME_PATH=$CHROME" >> $GITHUB_ENV

      - name: Переопределить группу (если задана вручную)
        if: ${{ github.event.inputs.group != '' && github.event.inputs.mode != 'test' }}
        run: |
          node -e "
            const fs = require('fs');
            const p = './dashboard/data/rotation-state.json';
            const s = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p)) : {};
            s.currentGroup = parseInt('${{ github.event.inputs.group }}');
            fs.mkdirSync('./dashboard/data', {recursive:true});
            fs.writeFileSync(p, JSON.stringify(s, null, 2));
          "

      - name: Запуск теста (5 моделей)
        if: ${{ github.event.inputs.mode == 'test' }}
        run: node scraper/scraper-test.js

      - name: Запуск основного сканера
        if: ${{ github.event.inputs.mode != 'test' }}
        run: node scraper/scraper.js

      - name: Коммит данных
        if: ${{ github.event.inputs.mode != 'test' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "3ddd Bot"
          git add dashboard/data/
          git diff --staged --quiet || git commit -m "📊 Обновление $(date '+%Y-%m-%d') — группа $(cat dashboard/data/rotation-state.json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).currentGroup||0))')"
          git pull --rebase origin main
          git push
